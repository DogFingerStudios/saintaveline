name: ok-to-test

on:
  issue_comment:
    types: [created]

jobs:
  trigger-builds:
    # AI: Only run when a CODEOWNER comments 'ok to test' on a pull request
    if: |
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, 'ok to test')
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Verify CODEOWNER and trigger builds
        uses: actions/github-script@v7
        with:
          script: |
            // AI: Read the CODEOWNERS file to verify the commenter is a listed owner
            let content;
            try
            {
              const { data: codeownersFile } = await github.rest.repos.getContent(
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: 'CODEOWNERS'
              });
              content = Buffer.from(codeownersFile.content, 'base64').toString();
            }
            catch (err)
            {
              console.log('CODEOWNERS file not found in repository root, skipping.');
              return;
            }
            const commenter = context.actor;

            // AI: Use word-boundary regex to avoid partial username matches
            const ownerPattern = new RegExp('(?:^|\\s)@' + commenter + '(?:\\s|$)', 'm');
            if (!ownerPattern.test(content))
            {
              console.log(`${commenter} is not a CODEOWNER, skipping.`);
              return;
            }

            // AI: Retrieve the PR head ref so builds run against the PR's code
            const pr = await github.rest.pulls.get(
            {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            const ref = pr.data.head.ref;

            // AI: Dispatch all three platform build workflows for the PR branch
            for (const workflow of ['windows.yml', 'ubuntu.yml', 'macos.yml'])
            {
              await github.rest.actions.createWorkflowDispatch(
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflow,
                ref: ref
              });
              console.log(`Triggered ${workflow} for ref: ${ref}`);
            }
